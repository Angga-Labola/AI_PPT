[project]
name = "fieldnotes-slide-studio"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12,<5.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "jinja2>=3.1,<4.0",
    "langchain-google-genai>=2.1,<4.0",
    "langgraph>=1.2,<2.0",
    "pillow>=10,<14",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.8,<3.0",
    "pypdf>=5.0,<7.0",
    "python-docx>=1.1,<2.0",
    "python-dotenv>=1.0,<2.0",
    "python-multipart>=0.0.9,<1.0",
    "python-pptx>=1.0,<2.0",
    "uvicorn[standard]>=0.30,<1.0",
    "vercel>=0.1,<1.0",
]

[tool.vercel]
entrypoint = "app:app"

[[tool.vercel.subscribers]]
entrypoint = "queue_worker"
